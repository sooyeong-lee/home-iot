# =====================================================================
# Home IoT CI/CD : GitHub Actions → GHCR → (매니페스트 갱신) → Argo CD
#
# ※ 참고용 — 실제 CI 는 Jenkins(Jenkinsfile, 가이드 7절)가 한다.
#   Jenkins 와 겹치지 않도록 지금은 수동 실행(workflow_dispatch)만 켜 두었다.
#   GitHub Actions 로 바꾸려면 아래 on: 의 주석을 풀고 Jenkins 를 멈춘다 (가이드 10-3절).
#
#  PR (→ main)   : 단위 테스트 · 매니페스트 렌더링 확인 · 이미지 빌드 · Trivy 검사 (push 없음)
#  push (main)   : 위 + GHCR push (sha-xxxxxxx, latest)
#                  + deploy/k8s/overlays/gitops 의 이미지 태그를 sha-xxxxxxx 로 바꿔 커밋
#                  → Argo CD 가 변경을 감지해 로컬 클러스터에 자동 배포
# =====================================================================
name: ci-cd

on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "deploy/k8s/overlays/gitops/**"   # 이 워크플로가 커밋하는 태그 변경으로 다시 돌지 않게
  #     - "docs/**"
  #     - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트
        run: npm test
      - name: JS 문법 확인
        run: |
          for f in $(git ls-files 'packages/**/*.js' 'services/**/*.js' 'tools/**/*.js' 'scripts/*.js'); do node --check "$f"; done
      - name: 매니페스트 렌더링 확인 (Argo CD 가 읽는 overlay)
        run: kubectl kustomize deploy/k8s/overlays/gitops > /dev/null

  # ---------------------------------------------------------------
  build:
    name: 이미지 ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,      context: .,     file: services/auth-service/Dockerfile }
          - { name: device-service,    context: .,     file: services/device-service/Dockerfile }
          - { name: control-service,   context: .,     file: services/control-service/Dockerfile }
          - { name: telemetry-service, context: .,     file: services/telemetry-service/Dockerfile }
          - { name: simulator,         context: .,     file: services/simulator/Dockerfile }
          - { name: web,               context: web,   file: web/Dockerfile }
          - { name: web-nginx,         context: nginx, file: nginx/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름·태그
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/home-iot/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 (로컬 적재)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy 취약점 검사 (CRITICAL 이 있으면 실패)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: GHCR push
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}"
          docker push "${{ steps.img.outputs.name }}:latest"

  # ---------------------------------------------------------------
  update-manifest:
    name: 배포 매니페스트 갱신 (GitOps)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 이미지 태그 변경
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          K=deploy/k8s/overlays/gitops/kustomization.yaml
          sed -i -E "s#newName: ghcr.io/[^/]+/home-iot/#newName: ghcr.io/${OWNER}/home-iot/#; s#newTag: .*#newTag: ${TAG}#" "$K"
          grep -E "newName|newTag" "$K"

      - name: 커밋 · push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/gitops/kustomization.yaml
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(deploy): 이미지 sha-${GITHUB_SHA::7} 배포"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

# =====================================================================
# Jenkins Configuration as Code — 첫 실행 시 관리자 계정·자격증명을 자동 설정
# ${...} 값은 ci/jenkins/.env 에서 들어온다 (git 에 올리지 않음)
# =====================================================================
jenkins:
  systemMessage: "Home IoT CI (t1-base) — Jenkinsfile: 저장소 루트"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-token
              description: "GitHub PAT (repo, write:packages) — 체크아웃 · GHCR push · 태그 커밋"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  timestamper:
    allPipelines: true

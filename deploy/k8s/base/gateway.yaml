# =====================================================================
# 외부 진입점: Envoy Gateway (v1.9.x, Gateway API)
#  - Gateway 주소는 MetalLB 가 dev 대역(10.10.31.100~127)에서 부여
#  - api-public : 로그인/가입/재발급/JWKS (JWT 검증 없음)
#  - api        : 나머지 API (overlay 의 SecurityPolicy 로 JWT 검증)
#  - web        : 화면(Nginx → Next.js), 시뮬레이터 대시보드
# Envoy Gateway 는 같은 Gateway 의 경로를 Exact > RegularExpression > PathPrefix(긴 것 우선) 순으로 매칭한다.
# =====================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homeiot-gw
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-public
spec:
  parentRefs: [{ name: homeiot-gw }]
  rules:
    - matches:
        - path: { type: Exact, value: /api/v1/auth/signup }
        - path: { type: Exact, value: /api/v1/auth/login }
        - path: { type: Exact, value: /api/v1/auth/refresh }
        - path: { type: Exact, value: /api/v1/auth/.well-known/jwks.json }
      backendRefs: [{ name: auth-service, port: 3001 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs: [{ name: homeiot-gw }]
  rules:
    - matches:
        - path: { type: Exact, value: /api/v1/auth/logout }
        - path: { type: PathPrefix, value: /api/v1/users }
      backendRefs: [{ name: auth-service, port: 3001 }]
    - matches:
        - path: { type: RegularExpression, value: "^/api/v1/devices/[^/]+/commands$" }
        - path: { type: PathPrefix, value: /api/v1/elevator }
      backendRefs: [{ name: control-service, port: 3003 }]
    - matches:
        - path: { type: RegularExpression, value: "^/api/v1/devices/[^/]+/events$" }
      backendRefs: [{ name: telemetry-service, port: 3004 }]
    - matches:
        - path: { type: PathPrefix, value: /api/v1/devices }
      backendRefs: [{ name: device-service, port: 3002 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs: [{ name: homeiot-gw }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /simulator }
      backendRefs: [{ name: simulator, port: 3005 }]
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs: [{ name: web-nginx, port: 80 }]

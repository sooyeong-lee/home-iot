apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service, part-of: homeiot }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, part-of: homeiot }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: auth-service
          image: homeiot/auth-service
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef: { name: homeiot-config }
            - secretRef: { name: homeiot-secrets }
          env:
            - name: PORT
              value: "3001"
            - name: JWT_PRIVATE_KEY_FILE
              value: /etc/homeiot/jwt/jwt-private.pem
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: jwt
              mountPath: /etc/homeiot/jwt
              readOnly: true
      volumes:
        - name: jwt
          secret:
            secretName: homeiot-jwt
            items:
            - key: jwt-private.pem
              path: jwt-private.pem
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels: { app: auth-service, part-of: homeiot }
spec:
  selector: { app: auth-service }
  ports:
    - name: http
      port: 3001
      targetPort: http
---

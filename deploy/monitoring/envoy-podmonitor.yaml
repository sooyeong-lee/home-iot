# Envoy 프록시 지표 수집 (가이드 8-8 0단계 · 8-9)
# 컨트롤러(컨트롤 플레인) 지표는 envoy-gateway-podmonitor.yaml
#   kubectl apply -f deploy/monitoring/envoy-podmonitor.yaml
# kube-prometheus-stack-values.yaml 에 podMonitorSelectorNilUsesHelmValues: false 가 있어야 읽힌다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s

# Mosquitto 2.x - Home IoT 로컬/클러스터 공용 설정
# 비밀번호 파일은 컨테이너 시작 시 MQTT_USERNAME / MQTT_PASSWORD 로 만든다 (mosquitto/entrypoint.sh)
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd

# 메타(retained) 메시지가 브로커 재시작 후에도 남도록 저장
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
